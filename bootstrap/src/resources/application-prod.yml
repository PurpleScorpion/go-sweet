server:
  port: 28666

sweet:
  mysql:
    host: host.mysql8.com
    port: 3306
    user: root
    password: root
    dbName: demo
    maxIdleConns: 50 # 最大空闲连接数
    maxOpenConns: 100 # 最大打开连接数
    useSSL: true
    pem: mysql.pem

  redis:
    host: redis8
    port: 6379
    database: 10

#  adx:
#    host: https://xxxxxxx
#    authMethod: SMI

  logging:
    level: info
    file: log/golang/sweet.log # 日志文件路径 必填
    maxSize: 10 # 单个日志文件最大大小，单位：MB
    maxDays: 30 # 单个日志文件保存天数
    maxBackups: 10 # 最大备份日志文件数量
    adapters:
      - file
      - console

  img:
    mappingUrl: /static # 映射的url 参考Tomcat映射图片地址配置
    path: /app/ems/imgs/
    baseUrl: https://xxxxxxx


  whitelist:
    - 192.168.1.2
